<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base</title>
</head>
<body>
   <nav>
   <ul>
   {% if user.is_authenticated %}
   <li><a href="{% url 'logout' %}">Logout</a></li>
   {% else %}
   <li><a href="{% url 'login' %}">Login</a></li>
   </ul>
   </nav>
{%endif%}
   <main>
    {% block content%} {% endblock%}
   </main>

</body>
</html>
