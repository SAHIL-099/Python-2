{% extends 'base.html' %}

{% block content %}

<!-- Search form for finding a student by roll number -->
<form method="GET" action="{% url 'search' %}">
    {% csrf_token %}
    Roll No: <input type="number" name="roll"  placeholder="Search by Roll Number">
    <button type="submit">Search</button>
</form>

<br>

<!-- Display the student list -->
{% if students %}
    {% for student in students %}
    <ul>
        <li>Roll No: {{ student.roll }}</li>
        <li>Name: {{ student.name }}</li>
        <li>Division: {{ student.division }}</li>
    </ul>
    <br>
    {% endfor %}
{% else %}
    <p>No students found.</p>
{% endif %}

{% endblock %}
